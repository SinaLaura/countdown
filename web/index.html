<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Countdown</title>
<meta name="theme-color" content="#17171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Countdown">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg: #17171c; --fg: #facd3c; --dim: #3a3a44; --text: #f2f2f5; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: background-color .4s, color .4s;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }
  main {
    height: 100vh; height: 100dvh;
    max-width: 640px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  [hidden] { display: none !important; }
  button, input { font: inherit; color: inherit; background: none; border: 0; outline: none; }
  button { cursor: pointer; touch-action: manipulation; }
  input { -webkit-user-select: text; user-select: text; }
  .muted { opacity: .5; }

  /* setup */
  .center { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 44px; }
  #label {
    width: 100%; text-align: center; font-size: 22px; padding: 10px 0;
    border-bottom: 1px solid var(--dim); transition: border-color .3s;
  }
  #label:focus { border-color: var(--fg); }
  #label::placeholder { color: var(--text); opacity: .35; }
  .seg { display: flex; justify-content: center; gap: 28px; }
  .seg button { font-size: 15px; padding: 6px 2px; opacity: .4; border-bottom: 2px solid transparent; }
  .seg button[aria-pressed="true"] { opacity: 1; border-color: var(--fg); }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .step {
    width: 56px; height: 56px; border-radius: 50%; flex: none;
    border: 1px solid var(--dim); font-size: 26px; line-height: 1;
  }
  .step:active { background: var(--dim); }
  #minVal, #timeVal { text-align: center; font-size: 64px; font-weight: 700; color: var(--fg); }
  #minVal { width: 150px; -moz-appearance: textfield; }
  #minVal::-webkit-inner-spin-button, #minVal::-webkit-outer-spin-button { -webkit-appearance: none; }
  #timeVal { display: block; margin: 0 auto; font-size: 56px; }
  .primary {
    height: 56px; border-radius: 28px; background: var(--fg); color: var(--bg);
    font-size: 18px; font-weight: 700; transition: background-color .4s, color .4s;
  }
  .primary:active { transform: scale(.98); }

  /* countdown */
  #count { font-size: clamp(34px, 10vw, 48px); font-weight: 700; line-height: 1.1; }
  #sub { margin-top: 4px; font-size: 15px; min-height: 1.3em; }
  #stage { flex: 1; min-height: 0; position: relative; margin: 20px 0 8px; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .exit { align-self: center; padding: 12px 28px; font-size: 15px; letter-spacing: .06em; }

  /* done */
  #doneText {
    flex: 1; display: grid; place-items: center; text-align: center;
    font-size: clamp(64px, 22vw, 120px); font-weight: 800; color: var(--fg);
    overflow-wrap: anywhere; animation: pop .6s ease-out;
  }
  #art { width: 100%; height: 34vh; }
  #doneText.long { font-size: clamp(40px, 12vw, 72px); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<main>
  <form id="setup" class="screen">
    <div class="center">
      <input id="label" type="text" maxlength="40" placeholder="What for?" aria-label="What for?" autocomplete="off" enterkeyhint="go">

      <div class="seg" role="group">
        <button type="button" data-mode="min" aria-pressed="true">Minutes</button>
        <button type="button" data-mode="time" aria-pressed="false">Time</button>
      </div>

      <div id="minPane" class="stepper">
        <button type="button" class="step" data-d="-1" aria-label="less">−</button>
        <input id="minVal" type="number" inputmode="numeric" min="1" max="999" value="37" aria-label="Minutes">
        <button type="button" class="step" data-d="1" aria-label="more">+</button>
      </div>
      <div id="timePane" hidden>
        <input id="timeVal" type="time" aria-label="Time">
      </div>
    </div>
    <button class="primary" type="submit">Start</button>
  </form>

  <section id="run" class="screen" hidden>
    <h1 id="count">37 left</h1>
    <p id="sub" class="muted"></p>
    <div id="stage"><canvas id="canvas"></canvas></div>
    <button class="exit muted" id="exit" type="button">Exit</button>
  </section>

  <section id="done" class="screen" hidden>
    <canvas id="art" hidden></canvas>
    <div id="doneText">DONE!</div>
    <button id="again" class="exit muted" type="button">Exit</button>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  const TITLE = 'Countdown';
  const ls = {
    get(k)    { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k)    { try { localStorage.removeItem(k); } catch (e) {} },
  };

  // ================= looks: palettes x modes, shuffled on every tap =================

  const PALETTES = [
    { bg: '#17171c', fg: '#facd3c', dim: '#3a3a44', text: '#f2f2f5', dark: true },  // night
    { bg: '#f3eee4', fg: '#e0503a', dim: '#ddd4c3', text: '#2a2a2a' },             // paper
    { bg: '#10241c', fg: '#8fe0a0', dim: '#2a4a3c', text: '#e6f4e9', dark: true },  // forest
    { bg: '#0a2342', fg: '#4fd8e0', dim: '#1f4068', text: '#e0f7fa', dark: true },  // ocean
    { bg: '#2b1a3b', fg: '#ff8a5c', dim: '#4a3360', text: '#ffd9b8', dark: true },  // dusk
    { bg: '#e6f5ee', fg: '#178a6c', dim: '#c6e3d6', text: '#0e3b30' },             // mint
    { bg: '#fff0f3', fg: '#f0507f', dim: '#f4d2db', text: '#5a2638' },             // blush
    { bg: '#000000', fg: '#ffffff', dim: '#2e2e2e', text: '#ffffff', dark: true },  // mono
    { bg: '#fbf5d8', fg: '#2d3ca0', dim: '#e9e0b2', text: '#2d3ca0' },             // cobalt
    { bg: '#1a0e09', fg: '#ff5233', dim: '#3e2318', text: '#ffb39c', dark: true },  // ember
    { bg: '#ece8ff', fg: '#6a4cf0', dim: '#d5cef7', text: '#2c2060' },             // lavender
    { bg: '#0a0d0a', fg: '#39ff6a', dim: '#163a20', text: '#39ff6a', dark: true },  // terminal
  ];

  // layout: positions for n items in a w x h box, plus item size d.
  // optional per mode: live (always animating), pos (moving items), item (custom drawing),
  // before/after (extra drawing), step (physics), tap, goneScale/goneDim/goneMs (how past items look)
  const MODES = [
    { name: 'dots',     shape: 'circle',  lay: (n, w, h) => grid(n, w, h, 1.6, 1.6) },
    { name: 'squares',  shape: 'square',  lay: (n, w, h) => grid(n, w, h, 1.5, 1.5) },
    { name: 'snake',    shape: 'circle',  body: 0.42, eyes: true, lay: (n, w, h) => grid(n, w, h, 1.45, 1.45, { snake: true }) },
    { name: 'spiral',   shape: 'circle',  guide: 'path', lay: spiral },
    { name: 'clock',    shape: 'circle',  guide: 'ring', lay: ring },
    { name: 'bars',     shape: 'bar',     lay: (n, w, h) => grid(n, w, h, 1.8, 3.6, { max: 26 }) },
    { name: 'honey',    shape: 'hex',     lay: (n, w, h) => grid(n, w, h, 0.95, 0.82, { offset: true, max: 56 }) },
    { name: 'rings',    shape: 'ring',    lay: (n, w, h) => grid(n, w, h, 1.5, 1.3, { offset: true }) },
    { name: 'diamonds', shape: 'diamond', hit: 0.4, lay: (n, w, h) => grid(n, w, h, 1.1, 0.55, { offset: true, max: 68 }) },
    { name: 'tiles',    shape: 'tri',     hit: 0.3, lay: (n, w, h) => grid(n, w, h, 0.58, 0.95, { max: 76 }) },
    // petals fall off and land on the ground
    { name: 'flower', lay: flower, reverse: true, goneScale: 0.45, goneMs: 2600, pos: petalPos, item: petal, before: stem, after: flowerCenter },
    // moons circle a planet, a passed minute drifts off into space
    { name: 'orbit', shape: 'circle', live: true, hit: 0.8, goneScale: 1, goneDim: 0.3, goneMs: 3000, lay: orbit, pos: moonPos, before: planet },
    // balls with gravity in a jar, tapping kicks them up, a passed minute pops
    { name: 'jar', shape: 'circle', hit: 0.6, goneScale: 1, goneDim: 0, goneMs: 450, lay: jar, step: jarStep, pos: ballPos, tap: jarTap, before: drawJar },
    // crawling caterpillar, turns into a butterfly at the end
    { name: 'caterpillar', shape: 'circle', live: true, body: 0.8, eyes: true, stripes: true, butterfly: true,
      lay: (n, w, h) => grid(n, w, h, 0.78, 1.6, { snake: true, max: 40 }), pos: crawl, after: antennae },
    // sand runs from the top bulb into the bottom one
    { name: 'hourglass', shape: 'circle', goneScale: 1, goneDim: 0.55, goneMs: 1400, lay: hourglass, pos: grainPos, before: glass },
    // a burning fuse with sparks
    { name: 'fuse', shape: 'circle', live: true, goneScale: 0.4, lay: fuse, step: fuseStep, before: fuseLine, after: sparks },
    // a bar of chocolate, pieces break off and leave a dashed gap
    { name: 'chocolate', keepHit: true, goneScale: 1, goneDim: 0, goneMs: 1100, lay: (n, w, h) => grid(n, w, h, 1.06, 0.9, { max: 52 }),
      pos: chunkPos, item: chunk, before: chunkHoles },
    // beads slide along the wires of an abacus
    { name: 'abacus', goneScale: 1, goneDim: 0.5, goneMs: 700, lay: abacus, pos: beadPos, item: bead, before: abacusFrame },
    // twinkling constellation, stars go out one by one
    { name: 'stars', live: true, hit: 0.8, goneScale: 0.25, lay: stars, pos: twinkle, item: star, before: starLines },
  ];

  const TAU = Math.PI * 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  // small deterministic random generator, so a layout looks the same every time
  function seeded(s) {
    return () => {
      s = s + 0x6D2B79F5 | 0;
      let t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function grid(n, w, h, cw, ch, opt) {
    opt = opt || {};
    const ex = opt.offset ? 0.5 : 0;
    let d = opt.max || 48, cols = 1, rows = 1;
    for (; d > 2; d -= 0.5) {
      cols = Math.max(1, Math.min(n, Math.floor((w - d) / (cw * d) + 1 - ex)));
      rows = Math.ceil(n / cols);
      if ((rows - 1) * ch * d + d <= h && (cols - 1 + ex) * cw * d + d <= w) break;
    }
    const bw = (cols - 1 + (rows > 1 ? ex : 0)) * cw * d, bh = (rows - 1) * ch * d;
    const x0 = (w - bw) / 2, y0 = (h - bh) / 2, pts = [];
    for (let i = 0; i < n; i++) {
      const r = Math.floor(i / cols);
      let c = i % cols;
      if (opt.snake && r % 2) c = cols - 1 - c;
      pts.push({ x: x0 + (c + (ex && r % 2 ? ex : 0)) * cw * d, y: y0 + r * ch * d, up: (r + c) % 2 === 0 });
    }
    return { pts, d };
  }

  // archimedean spiral, first item in the middle -> time runs out from the outside in
  function spiral(n, w, h) {
    const raw = [];
    let th = Math.PI;
    for (let i = 0; i < n; i++) {
      const r = th / (2 * Math.PI);
      raw.push({ x: r * Math.cos(th), y: r * Math.sin(th) });
      th += 1 / Math.max(r, 0.5);
    }
    const R = Math.max.apply(null, raw.map(p => Math.hypot(p.x, p.y))) + 0.5;
    const k = Math.min(w, h) / 2 / R;
    return { pts: raw.map(p => ({ x: w / 2 + p.x * k, y: h / 2 + p.y * k })), d: Math.min(0.72 * k, 56) };
  }

  // one circle like a clock face, starting at 12 o'clock
  function ring(n, w, h) {
    const R0 = Math.min(w, h) / 2;
    let d = Math.min(44, R0 * 0.3, 2 * Math.PI * R0 / n * 0.65);
    const R = R0 - d / 2 - 4;
    d = Math.min(d, 2 * Math.PI * R / n * 0.65);
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + i * 2 * Math.PI / n;
      pts.push({ x: w / 2 + R * Math.cos(a), y: h / 2 + R * Math.sin(a) });
    }
    return { pts, d, circle: { x: w / 2, y: h / 2, r: R } };
  }

  // petals in rings around a centre (inner rings first, so the outer petals fall first)
  function flower(n, w, h) {
    const cx = w / 2, cy = h * 0.38, R = Math.min(w * 0.46, h * 0.34), rc = R * 0.2, rnd = seeded(n);
    const L = Math.ceil(n / 20), pts = [];
    for (let j = 0; j < L; j++) {
      const m = Math.floor(n / L) + (j < n % L ? 1 : 0);
      const tip = L === 1 ? R : R * (0.5 + 0.5 * j / (L - 1)), len = tip - rc * 0.5, mid = rc * 0.5 + len / 2;
      const wid = Math.min(len * 0.42, TAU * mid / m * 1.1);
      for (let k = 0; k < m; k++) {
        const a = -Math.PI / 2 + (k + (j % 2) * 0.5) * TAU / m;
        pts.push({
          x: cx + Math.cos(a) * mid, y: cy + Math.sin(a) * mid, a, len, wid, hr: len * 0.45,
          lx: w * (0.08 + 0.84 * rnd()), ly: h - wid * 0.55 - rnd() * 8, la: (rnd() - 0.5) * 0.8, sway: rnd() * TAU,
        });
      }
    }
    return { pts, d: pts.length ? pts[pts.length - 1].wid : 20, flower: { cx, cy, R, rc } };
  }

  // moons on orbits around a planet; outer orbits get more moons
  function orbit(n, w, h) {
    const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 4, pr = R * 0.18;
    let d = 34, radii = [], caps = [];
    for (; d > 3; d -= 0.5) {
      radii = []; caps = [];
      for (let r = pr * 1.9 + d; r <= R - d / 2; r += d * 1.9) { radii.push(r); caps.push(Math.floor(TAU * r / (d * 1.7))); }
      if (caps.reduce((a, b) => a + b, 0) >= n) break;
    }
    if (!radii.length) { radii = [R * 0.7]; caps = [n]; }
    const tot = caps.reduce((a, b) => a + b, 0) || 1;
    const cnt = caps.map(cp => Math.floor(n * cp / tot));
    for (let rest = n - cnt.reduce((a, b) => a + b, 0), j = 0; rest > 0; rest--, j = (j + 1) % cnt.length) cnt[j]++;
    const pts = [];
    radii.forEach((r, j) => {
      for (let k = 0; k < cnt[j]; k++) {
        const a0 = k * TAU / cnt[j] + j * 0.9;
        pts.push({ r, a0, w: 0.3 * Math.pow(radii[0] / r, 1.5), x: cx + Math.cos(a0) * r, y: cy + Math.sin(a0) * r });
      }
    });
    return { pts, d, orbit: { cx, cy, R, pr, radii } };
  }

  // balls stacked above a jar; they drop in when the look appears
  function jar(n, w, h) {
    const jw = Math.min(w * 0.82, h * 0.66), jh = Math.min(h * 0.92, jw * 1.4);
    const left = (w - jw) / 2, right = left + jw, bottom = (h + jh) / 2, top = bottom - jh;
    const r = Math.max(3, Math.min(24, Math.sqrt(jw * jh * 0.45 / (n * Math.PI))));
    const cols = Math.max(1, Math.floor(jw / (2 * r)) - 1), rnd = seeded(n), pts = [];
    for (let i = 0; i < n; i++) {
      const row = Math.floor(i / cols), col = i % cols;
      pts.push({ id: i, x: left + r * 2 + col * 2 * r + (row % 2) * r + (rnd() - 0.5) * 2, y: bottom - r - row * 2 * r - jh * 0.4, vx: 0, vy: 0 });
    }
    return { pts, d: 2 * r, r, jar: { left, right, top, bottom } };
  }

  // two triangles of sand; a passed minute slides to the neck and drops into the lower bulb
  function hourglass(n, w, h) {
    const hh = Math.min(h * 0.46, w * 0.8), gw = Math.min(w * 0.9, hh * 1.3), cx = w / 2, cy = h / 2;
    // grain slots in a triangle, either starting at the apex (top sand) or at the base (bottom pile)
    const tri = (cell, apex, base, fromApex) => {
      const out = [], dir = Math.sign(base - apex), len = Math.abs(base - apex), rowH = cell * 0.87;
      const rows = Math.floor(len / rowH);
      for (let r = 0; r < rows; r++) {
        const t = fromApex ? (r + 0.5) * rowH : len - (r + 0.5) * rowH;   // distance from the apex
        const width = gw * t / len;
        let cnt = Math.floor((width - cell * 0.3) / cell);
        if (cnt < 1 && fromApex && width > cell * 0.7) cnt = 1;   // single grains right at the neck
        if (cnt < 1) { if (fromApex) continue; else break; }
        for (let k = 0; k < cnt; k++) out.push({ x: cx + (k - (cnt - 1) / 2) * cell, y: apex + dir * t });
      }
      return out;
    };
    let cell = 44, top = [], bot = [];
    for (; cell > 2; cell -= 0.5) {
      top = tri(cell, cy - 3, cy - hh, true);
      bot = tri(cell, cy + 3, cy + hh, false);
      if (top.length >= n && bot.length >= n) break;
    }
    const pts = [];
    for (let i = 0; i < n; i++) {
      const t = top[i] || top[top.length - 1], b = bot[n - 1 - i] || bot[0];
      pts.push({ x: t.x, y: t.y, bx: b.x, by: b.y });
    }
    return { pts, d: cell * 0.82, glass: { cx, cy, hh, gw } };
  }

  // beads on a winding fuse that burns down from the far end
  function fuse(n, w, h) {
    const g = grid(n, w, h, 1.9, 2.2, { snake: true, max: 30 });
    g.pts.forEach(p => p.y += Math.sin(p.x / 40) * g.d * 0.35);
    g.sparks = [];
    return g;
  }

  // ten beads per wire, a passed minute slides to the right
  function abacus(n, w, h) {
    const per = 10, rows = Math.ceil(n / per);
    let bw = Math.min(w / 15, 40);
    const rs = Math.min(h / (rows + 0.6), bw * 1.6);
    bw = Math.min(bw, rs * 1.3);
    const bh = Math.min(bw * 0.8, rs * 0.8), ww = bw * 15, x0 = (w - ww) / 2, y0 = (h - (rows - 1) * rs) / 2, pts = [];
    for (let i = 0; i < n; i++) {
      const r = Math.floor(i / per), k = i % per, last = Math.min(per, n - r * per) - 1;
      pts.push({ x: x0 + bw * (k + 1), y: y0 + r * rs, rx: x0 + ww - bw * (last - k + 1) });
    }
    return { pts, d: bw, abacus: { x0, ww, y0, rows, rs, bh } };
  }

  // stars scattered over the sky, chained to their nearest neighbour like a constellation
  function stars(n, w, h) {
    const rnd = seeded(n * 31 + 7), slots = Math.ceil(n * 1.8);
    const cols = Math.max(1, Math.round(Math.sqrt(slots * w / h))), rows = Math.ceil(slots / cols), cw = w / cols, ch = h / rows;
    const cells = Array.from({ length: cols * rows }, (_, i) => i);
    for (let i = cells.length - 1; i > 0; i--) { const j = rnd() * (i + 1) | 0; [cells[i], cells[j]] = [cells[j], cells[i]]; }
    let left = cells.slice(0, n).map(k => ({
      x: (k % cols + 0.2 + 0.6 * rnd()) * cw, y: (Math.floor(k / cols) + 0.2 + 0.6 * rnd()) * ch, ph: rnd() * TAU,
    }));
    const pts = [];
    let cur = left.reduce((a, b) => (a.x + a.y < b.x + b.y ? a : b));
    while (cur) {
      left = left.filter(p => p !== cur);
      pts.push(cur);
      let best = null, bd = Infinity;
      for (const p of left) { const dd = (p.x - cur.x) ** 2 + (p.y - cur.y) ** 2; if (dd < bd) { bd = dd; best = p; } }
      cur = best;
    }
    return { pts, d: Math.min(30, Math.min(cw, ch) * 0.55) };
  }

  function bag(n) {
    let q = [];
    return cur => {
      if (!q.length) {
        q = Array.from({ length: n }, (_, i) => i).filter(i => i !== cur);
        for (let i = q.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [q[i], q[j]] = [q[j], q[i]]; }
      }
      return q.pop();
    };
  }
  const nextMode = bag(MODES.length), nextPal = bag(PALETTES.length);

  let look = ls.get('countdown-look');
  if (!look || !MODES[look.m] || !PALETTES[look.p]) look = { m: 0, p: 0 };

  function applyPalette() {
    const p = PALETTES[look.p], root = document.documentElement;
    for (const k of ['bg', 'fg', 'dim', 'text']) root.style.setProperty('--' + k, p[k]);
    root.style.colorScheme = p.dark ? 'dark' : 'light';
    document.querySelector('meta[name=theme-color]').content = p.bg;
  }
  applyPalette();

  // ================= setup =================

  let end = 0, total = 0, timer = 0, shownMin = -1, label = '';
  let mode = 'min', minutes = ls.get('countdown-min') || 37, audio = null, wake = null;

  const show = id => document.querySelectorAll('.screen').forEach(s => s.hidden = s.id !== id);

  // ---- constellation ----
  function twinkle(X, i, g, p) {
    return X.still || g >= 1 ? null : { x: p.x, y: p.y, s: 1 + 0.18 * Math.sin(X.now / 380 + p.ph) };
  }
  function star(X, i, x, y, k) {
    const c = X.c, r = X.d * k / 2, ri = r * 0.3;
    c.beginPath();
    for (let j = 0; j < 8; j++) { const a = -Math.PI / 2 + j * Math.PI / 4, rad = j % 2 ? ri : r; c.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
    c.closePath(); c.fill();
  }
  function starLines(X) {
    const { c, P, pts } = X;
    for (let i = 0; i < pts.length - 1; i++) {
      const lit = i + 1 < X.min;
      c.strokeStyle = lit ? P.fg : P.dim; c.lineWidth = lit ? 1.2 : 1;
      c.globalAlpha = X.all * (lit ? 0.35 : 0.7);
      c.beginPath(); c.moveTo(pts[i].x, pts[i].y); c.lineTo(pts[i + 1].x, pts[i + 1].y); c.stroke();
    }
    c.globalAlpha = X.all;
  }

  // returns true while something is still animating
  function draw(now) {
    const c = ctx, M = MODES[look.m], P = PALETTES[look.p], pts = geo.pts, d = geo.d, n = pts.length;
    let busy = !!M.live && !still;
    c.clearRect(0, 0, W, H);
    if (!n) return false;
    const dt = lastNow ? Math.min(0.05, (now - lastNow) / 1000) : 1 / 60;
    lastNow = now;

    const all = still ? 1 : clamp((now - born) / 500);
    if (all < 1) busy = true;
    const stag = Math.min(14, 500 / n), goneMs = M.goneMs || 800;
    const intro = i => { const t = still ? 1 : clamp((now - born - i * stag) / 380); if (t < 1) busy = true; return easeBack(t); };
    const gone = i => {
      if (i < shownMin) return 0;
      const t0 = goneAt.get(i);
      if (t0 === undefined) return 1;
      const t = still ? 1 : clamp((now - t0) / goneMs);
      if (t < 1) busy = true; else goneAt.delete(i);
      return easeOut(t);
    };
    const X = { c, P, d, pts, n, now, min: shownMin, gone, intro, all, still, geo };
    if (M.step && M.step(X, dt)) busy = true;

    // positions first (some modes move their items), then guides, then the items
    for (let i = 0; i < n; i++) {
      const p = pts[i], g = gone(i), q = M.pos ? M.pos(X, i, g, p) : null;
      p.g = g; p.q = q; p.cx = q ? q.x : p.x; p.cy = q ? q.y : p.y;
    }

    c.lineCap = c.lineJoin = 'round';
    c.globalAlpha = all;
    if (M.guide === 'path') {
      c.strokeStyle = P.dim; c.lineWidth = Math.max(1, d * 0.08);
      c.beginPath(); pts.forEach(p => c.lineTo(p.x, p.y)); c.stroke();
    } else if (M.guide === 'ring') {
      c.strokeStyle = P.dim; c.lineWidth = Math.max(1, d * 0.08);
      c.beginPath(); c.arc(geo.circle.x, geo.circle.y, geo.circle.r, 0, Math.PI * 2); c.stroke();
    }
    if (M.body && shownMin > 0) {
      // body runs through all remaining items, the tail retracts as minutes pass
      c.strokeStyle = P.fg; c.lineWidth = d * M.body;
      c.beginPath();
      for (let i = 0; i < Math.min(shownMin, n); i++) c.lineTo(pts[i].cx, pts[i].cy);
      if (shownMin < n && goneAt.has(shownMin)) {
        const g = gone(shownMin), a = pts[shownMin - 1], b = pts[shownMin];
        c.lineTo(a.cx + (b.cx - a.cx) * (1 - g), a.cy + (b.cy - a.cy) * (1 - g));
      }
      c.stroke();
    }
    if (M.before) M.before(X);
    c.globalAlpha = 1;

    const gs = M.goneScale === undefined ? 0.35 : M.goneScale, gd = M.goneDim === undefined ? 1 : M.goneDim;
    for (let k = 0; k < n; k++) {
      const i = M.reverse ? n - 1 - k : k, p = pts[i], g = p.g, q = p.q;
      let pk = 0, pt01 = 0;
      const pt = pulses.get(i);
      if (pt !== undefined) {
        pt01 = (now - pt) / 450;
        if (pt01 >= 1) pulses.delete(i); else { busy = true; pk = Math.sin(Math.PI * pt01); }
      }
      const sc = (1 - (1 - gs) * g) * intro(i) * (1 + 0.3 * pk) * (q && q.s !== undefined ? q.s : 1);
      p.hidden = d * sc <= 0.2 || (q && q.a === 0);
      if (p.hidden) continue;
      let col = M.stripes && i % 2 ? mix(P.fg, P.bg, 0.15) : P.fg;
      const tn = tints.get(i);
      if (tn) {
        const tt = clamp((now - tn.t0) / 350);
        if (tt < 1) busy = true;
        col = mix(tn.from, tn.to, still ? 1 : tt);
      }
      const fill = mix(col, P.dim, g * gd);
      c.fillStyle = c.strokeStyle = fill;
      c.globalAlpha = q && q.a !== undefined ? q.a : 1;
      if (M.item) M.item(X, i, p.cx, p.cy, sc, q, p, fill); else shape(M.shape, p, p.cx, p.cy, d * sc, g);
      c.globalAlpha = 1;
      if (pk) {
        c.globalAlpha = 1 - pt01; c.strokeStyle = P.fg; c.lineWidth = 2;
        c.beginPath(); c.arc(p.cx, p.cy, (p.hr || d * 0.55) + d * 0.6 * pt01, 0, Math.PI * 2); c.stroke();
        c.globalAlpha = 1;
      }
    }
    if (M.after) M.after(X);

    if (M.eyes && shownMin > 0 && d > 12) {
      const p = pts[0], e = d * 0.09 * intro(0);
      c.fillStyle = P.bg;
      c.beginPath(); c.arc(p.cx - d * 0.16, p.cy - d * 0.06, e, 0, Math.PI * 2); c.arc(p.cx + d * 0.16, p.cy - d * 0.06, e, 0, Math.PI * 2); c.fill();
    }
    return busy;
  }

  function hitTest(x, y) {
    const M = MODES[look.m], d = geo.d;
    let hit = -1, best = Infinity;
    for (let i = 0; i < geo.pts.length; i++) {
      const p = geo.pts[i];
      if (p.hidden && !M.keepHit) continue;
      const px = p.hidden || p.cx === undefined ? p.x : p.cx, py = p.hidden || p.cy === undefined ? p.y : p.cy;
      const dx = Math.abs(px - x), dy = Math.abs(py - y);
      const inside = M.shape === 'bar' ? dx < d * 0.7 && dy < d * 1.6 : Math.hypot(dx, dy) < (p.hr || d * (M.hit || 0.55));
      if (inside && dx + dy < best) { best = dx + dy; hit = i; }
    }
    return hit;   // may also be a past item
  }

  function restyle() {
    look = { m: nextMode(look.m), p: nextPal(look.p) };
    ls.set('countdown-look', look);
    applyPalette();
    born = performance.now();
    pulses.clear(); tints.clear();
    relayout();
  }

  // tap an item -> it pulses; tap anywhere else -> new look
  $('run').addEventListener('pointerdown', e => {
    if (e.target.closest('.exit')) return;
    const r = canvas.getBoundingClientRect();
    const i = hitTest(e.clientX - r.left, e.clientY - r.top);
    if (i >= shownMin) return;   // past item: nothing happens
    if (i >= 0) {
      const now = performance.now(), M = MODES[look.m];
      pulses.set(i, now);
      // sometimes the item also takes on a slightly different colour
      if (Math.random() < 0.45) {
        // always a neighbour of the palette colour, so repeated taps don't drift away
        const base = PALETTES[look.p].fg, tn = tints.get(i);
        tints.set(i, { from: tn ? tn.to : base, to: nudge(base), t0: now });
      }
      if (M.tap) M.tap(geo, i);
      if (navigator.vibrate) navigator.vibrate(8);
      kick();
    } else restyle();
  });

  // ---- butterfly on the end screen (after the caterpillar) ----
  let artRaf = 0;
  function butterfly(on) {
    const cv = $('art');
    cv.hidden = !on;
    cancelAnimationFrame(artRaf);
    if (!on) return;
    const x = cv.getContext('2d');
    const loop = now => {
      if ($('done').hidden) return;
      const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      if (cv.width !== Math.round(r.width * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
      x.setTransform(dpr, 0, 0, dpr, 0, 0);
      x.clearRect(0, 0, r.width, r.height);
      const P = PALETTES[look.p], s = Math.min(r.width, r.height) * 0.42, t = still ? 0 : now / 1000;
      const f = still ? 1 : 0.3 + 0.7 * Math.abs(Math.cos(t * 4));
      x.save();
      x.translate(r.width / 2 + Math.sin(t * 0.9) * s * 0.25, r.height / 2 + Math.sin(t * 1.7) * s * 0.12);
      for (const side of [-1, 1]) {
        x.save(); x.scale(side * f, 1);
        x.fillStyle = P.fg; x.beginPath(); x.ellipse(s * 0.42, -s * 0.18, s * 0.42, s * 0.3, -0.5, 0, TAU); x.fill();
        x.fillStyle = mix(P.fg, P.text, 0.35); x.beginPath(); x.ellipse(s * 0.3, s * 0.25, s * 0.26, s * 0.2, 0.5, 0, TAU); x.fill();
        x.restore();
      }
      x.strokeStyle = P.text; x.lineCap = 'round';
      x.lineWidth = s * 0.08; x.beginPath(); x.moveTo(0, -s * 0.3); x.lineTo(0, s * 0.4); x.stroke();
      x.lineWidth = s * 0.025; x.beginPath();
      x.moveTo(0, -s * 0.3); x.quadraticCurveTo(-s * 0.1, -s * 0.55, -s * 0.22, -s * 0.62);
      x.moveTo(0, -s * 0.3); x.quadraticCurveTo(s * 0.1, -s * 0.55, s * 0.22, -s * 0.62);
      x.stroke();
      x.restore();
      if (!still) artRaf = requestAnimationFrame(loop);
    };
    artRaf = requestAnimationFrame(loop);
  }

  // on the end screen a tap just swaps the colours
  $('done').addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    look.p = nextPal(look.p);
    ls.set('countdown-look', look);
    applyPalette();
    if (!$('art').hidden && still) butterfly(true);
  });

  // ================= sound (browsers only allow it after a tap, so we unlock on Start) =================

  function unlockAudio() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      audio.resume();
    } catch (e) {}
  }
  document.addEventListener('pointerdown', unlockAudio);

  // soft rising sweep, then a shimmering chord with a space echo
  function beep() {
    if (!audio) return;
    audio.resume();
    const a = audio, t0 = a.currentTime + 0.05, out = a.createGain();
    out.gain.value = 0.5;
    const echo = a.createDelay(1), fb = a.createGain(), wet = a.createGain();
    echo.delayTime.value = 0.28; fb.gain.value = 0.38; wet.gain.value = 0.45;
    out.connect(a.destination);
    out.connect(echo); echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(a.destination);

    const sw = a.createOscillator(), sg = a.createGain();
    sw.type = 'sine';
    sw.frequency.setValueAtTime(180, t0);
    sw.frequency.exponentialRampToValueAtTime(1400, t0 + 0.55);
    sg.gain.setValueAtTime(0.0001, t0);
    sg.gain.exponentialRampToValueAtTime(0.12, t0 + 0.1);
    sg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
    sw.connect(sg).connect(out);
    sw.start(t0); sw.stop(t0 + 0.65);

    [659.3, 987.8, 1318.5, 1975.5].forEach((f, k) => {
      const t = t0 + 0.5 + k * 0.09;
      for (const det of [-6, 6]) {
        const o = a.createOscillator(), g = a.createGain();
        o.type = k % 2 ? 'triangle' : 'sine';
        o.frequency.value = f;
        o.detune.value = det;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
        o.connect(g).connect(out);
        o.start(t); o.stop(t + 1.7);
      }
    });
  }

  // ================= native app (Capacitor): alarm even when the phone is locked =================
  // In the browser this does nothing. In the store app it uses @capacitor/local-notifications.

  const native = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
    ? window.Capacitor.Plugins : null;

  function scheduleAlarm() {
    const LN = native && native.LocalNotifications;
    if (!LN) return;
    LN.requestPermissions()
      .then(() => LN.schedule({ notifications: [{
        id: 1, title: (label || 'Done') + '!', body: 'Time is up.',
        schedule: { at: new Date(end), allowWhileIdle: true },
      }] }))
      .catch(() => {});
  }
  function cancelAlarm() {
    const LN = native && native.LocalNotifications;
    if (LN) LN.cancel({ notifications: [{ id: 1 }] }).catch(() => {});
  }

  // ================= keep the screen on while counting down =================

  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wake && document.visibilityState === 'visible') {
        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', () => wake = null);
      }
    } catch (e) {}
  }
  function letSleep() { try { if (wake) wake.release(); } catch (e) {} wake = null; }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !$('run').hidden) { tick(); keepAwake(); }
  });

  // ================= start: ?m=37 or ?bis=18:30 (optional &t=Lunch, &look=3) starts right away =================

  const q = new URLSearchParams(location.search);
  const saved = ls.get('countdown');
  ls.del('essen');
  if (q.has('look')) { const v = q.get('look').split('.').map(Number); look = { m: (v[0] || 0) % MODES.length, p: (v[1] || 0) % PALETTES.length }; applyPalette(); }
  if (saved) label = saved.label || '';
  if (q.has('m') || q.has('bis')) {
    history.replaceState(null, '', location.pathname);
    label = (q.get('t') || '').trim().slice(0, 40);
    if (q.has('bis')) begin(endFromTime(q.get('bis')));
    else { setMinutes(+q.get('m')); begin(Date.now() + minutes * 60000); }
  } else if (saved && saved.end > Date.now()) {
    begin(saved.end, saved.total);
  } else if (saved && Date.now() - saved.end < 15 * 60000) {
    finish(true);
  } else {
    ls.del('countdown');
  }

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
