<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hourglass physics test</title>
<!-- Test page only, not part of the app: the app itself stays free of external libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  :root { --bg: #17171c; --fg: #facd3c; --dim: #3a3a44; --text: #f2f2f5; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 20px 20px 0; }
  #count { font-size: 44px; font-weight: 700; line-height: 1; }
  #sub { font-size: 13px; opacity: .55; margin-top: 6px; }
  #stage { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  footer { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; padding: 14px 16px 22px; }
  button, input { font: inherit; font-size: 14px; color: var(--text); background: none; border: 0; opacity: .6; cursor: pointer; padding: 4px 2px; }
  button:hover, button.on { opacity: 1; }
  input { width: 3.2em; border-bottom: 1px solid var(--dim); text-align: center; cursor: text; }
</style>
</head>
<body>
<header>
  <div id="count"></div>
  <div id="sub">hourglass physics test · Matter.js</div>
</header>
<div id="stage"><canvas id="cv"></canvas></div>
<footer>
  <label><input id="min" type="number" min="1" max="200" value="10"> min</label>
  <button id="restart">Restart</button>
  <button data-ms="1000">1 s</button>
  <button data-ms="4000">4 s</button>
  <button data-ms="60000">1 min</button>
  <button id="pause">Pause</button>
</footer>
<script>
  const { Engine, Bodies, Body, Composite } = Matter;
  const P = { bg: '#17171c', fg: '#facd3c', dim: '#3a3a44', text: '#f2f2f5' };
  const TAU = Math.PI * 2, GATE = 0x0002, ALL = 0xffffffff;
  const cv = document.getElementById('cv'), c = cv.getContext('2d');
  const q = new URLSearchParams(location.search);
  document.getElementById('min').value = +q.get('m') || 10;

  let engine, G, grains, every = +q.get('every') || 1000, last = 0, paused = 0, pulses = new Map(), W = 0, H = 0;

  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ch = s => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t);
    return '#' + ((1 << 24) + (ch(16) << 16) + (ch(8) << 8) + ch(0)).toString(16).slice(1);
  }

  // a static wall along the line a→b, its inner face on the line, pushed away from the inside point
  function wall(ax, ay, bx, by, ix, iy, slip) {
    const th = 14, dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy);
    let nx = dy / len, ny = -dx / len;
    if ((ix - ax) * nx + (iy - ay) * ny > 0) { nx = -nx; ny = -ny; }
    return Bodies.rectangle((ax + bx) / 2 + nx * th / 2, (ay + by) / 2 + ny * th / 2, len + th, th,
      { isStatic: true, angle: Math.atan2(dy, dx), friction: slip ? 0 : 0.3, frictionStatic: slip ? 0 : 0.5 });
  }

  function start() {
    const r = document.getElementById('stage').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.max(1, Math.min(200, Math.round(+document.getElementById('min').value) || 10));

    engine = Engine.create({ positionIterations: 10, velocityIterations: 8 });
    engine.gravity.y = 1;
    // same proportions as the app's hourglass; grains sized so the sand fills about half of the top bulb
    const hh = Math.min(H * 0.46, W * 0.8), gw = Math.min(W * 0.9, hh * 1.3), cx = W / 2, cy = H / 2;
    const d = Math.max(5, Math.min(24, Math.sqrt(0.5 * gw * hh * 0.5 / (n * 0.87))));
    // neck: half width, half height; wide enough that grains don't wedge in it (the gate holds them, not the neck)
    const nk = Math.max(gw * 0.03, d * 1.3), nh = d * 0.9;
    const l = cx - gw / 2, rr = cx + gw / 2;
    G = { cx, cy, hh, gw, nk, nh, d, l, r: rr, n };
    const up = [cx, cy - hh * 0.4], dn = [cx, cy + hh * 0.4], mid = [cx, cy];
    const walls = [
      wall(l, cy - hh, cx - nk, cy - nh, ...up), wall(rr, cy - hh, cx + nk, cy - nh, ...up),
      wall(cx - nk, cy - nh, cx - nk, cy + nh, ...mid, true), wall(cx + nk, cy - nh, cx + nk, cy + nh, ...mid, true),
      wall(cx - nk, cy + nh, l, cy + hh, ...dn), wall(cx + nk, cy + nh, rr, cy + hh, ...dn),
      wall(l, cy - hh, rr, cy - hh, ...up), wall(l, cy + hh, rr, cy + hh, ...dn),
    ];
    // the gate across the neck holds the sand; one grain at a time is let through it
    G.gate = Bodies.rectangle(cx, cy, nk * 2 + 2, 4, { isStatic: true, collisionFilter: { category: GATE } });
    Composite.add(engine.world, [...walls, G.gate]);

    // fill the top bulb row by row from the neck upwards, slightly irregular grains
    grains = [];
    for (let row = 0; grains.length < n && row < 400; row++) {
      const y = cy - d * 0.7 - row * d * 0.87, hw = nk + (cy - y) / hh * (gw / 2 - nk) - d * 0.6;
      const cnt = Math.max(1, Math.floor(hw * 2 / d));
      for (let k = 0; k < cnt && grains.length < n; k++) {
        const x = cx - (cnt - 1) * d / 2 + k * d + (row % 2 ? d * 0.25 : 0);
        const rad = d / 2 * (0.85 + Math.random() * 0.15);
        const b = Bodies.polygon(x, y, 6 + (Math.random() * 3 | 0), rad, {
          friction: 0.5, frictionStatic: 1, restitution: 0, frictionAir: 0.012, density: 0.002, angle: Math.random() * TAU,
          collisionFilter: { category: 0x0001, mask: ALL },
        });
        b.tone = Math.random() * 2 - 1;
        grains.push(b);
      }
    }
    Composite.add(engine.world, grains);
    for (let k = 0; k < 240; k++) Engine.update(engine, 1000 / 120);   // let the sand settle before showing it
    last = performance.now(); paused = 0; pulses.clear();
    document.getElementById('pause').textContent = 'Pause';
    show();
  }

  const left = () => grains.filter(b => !b.released).length;
  function show() {
    const n = left();
    document.getElementById('count').textContent = n ? n + ' left' : 'DONE!';
  }

  // one "minute" passed: the grain resting nearest the neck may pass the gate
  function release() {
    let best = null, bd = Infinity;
    for (const b of grains) {
      if (b.released) continue;
      const dd = Math.hypot(b.position.x - G.cx, b.position.y - (G.cy - G.d * 0.5));
      if (dd < bd) { bd = dd; best = b; }
    }
    if (!best) return;
    best.released = performance.now();
    best.collisionFilter.mask = ALL & ~GATE;
    Body.setVelocity(best, { x: (G.cx - best.position.x) * 0.05, y: Math.max(best.velocity.y, 1.5) });   // a little push into the neck
    show();
  }

  function step(now) {
    if (!paused) {
      if (left() && now - last >= every) { last = now; release(); }
      for (let k = 0; k < 2; k++) Engine.update(engine, 1000 / 120);
      // once through the neck, a grain is solid against the gate again
      for (const b of grains) if (b.released && b.collisionFilter.mask !== ALL && b.position.y > G.cy + G.d) b.collisionFilter.mask = ALL;
    }
    draw(now);
    requestAnimationFrame(step);
  }

  function draw(now) {
    const { cx, cy, hh, gw, nk, nh, l, r } = G;
    c.clearRect(0, 0, W, H);
    c.lineCap = c.lineJoin = 'round';
    c.strokeStyle = P.dim; c.lineWidth = 2;
    c.beginPath();
    c.moveTo(l, cy - hh); c.lineTo(cx - nk, cy - nh); c.lineTo(cx - nk, cy + nh); c.lineTo(l, cy + hh);
    c.moveTo(r, cy - hh); c.lineTo(cx + nk, cy - nh); c.lineTo(cx + nk, cy + nh); c.lineTo(r, cy + hh);
    c.stroke();
    c.lineWidth = 5;
    c.beginPath(); c.moveTo(l - 8, cy - hh); c.lineTo(r + 8, cy - hh); c.moveTo(l - 8, cy + hh); c.lineTo(r + 8, cy + hh); c.stroke();
    for (const b of grains) {
      // passed grains turn pale once they have landed, like in the app
      const g = b.released ? Math.min(1, (now - b.released) / 1600) : 0;
      let col = mix(P.fg, b.tone > 0 ? '#ffffff' : '#000000', Math.abs(b.tone) * 0.16);
      col = mix(col, P.dim, g * 0.55);
      const pt = pulses.get(b.id), pk = pt !== undefined ? Math.sin(Math.PI * Math.min(1, (now - pt) / 450)) : 0;
      if (pt !== undefined && now - pt > 450) pulses.delete(b.id);
      const v = b.vertices, s = 1 + 0.3 * pk;
      c.fillStyle = col;
      c.beginPath();
      for (const p of v) c.lineTo(b.position.x + (p.x - b.position.x) * s, b.position.y + (p.y - b.position.y) * s);
      c.closePath(); c.fill();
    }
    if (paused) {   // the app's pause slider, centred on the neck
      const len = nk * 5;
      c.strokeStyle = P.dim; c.lineWidth = 2;
      c.beginPath(); c.moveTo(cx - len / 2, cy); c.lineTo(cx + len / 2, cy); c.stroke();
    }
  }

  // tap a waiting grain: it pulses and gets a little nudge
  cv.addEventListener('pointerdown', e => {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    const b = grains.find(b => !b.released && Matter.Vertices.contains(b.vertices, { x, y }));
    if (!b) return;
    pulses.set(b.id, performance.now());
    if (!paused) Body.setVelocity(b, { x: b.velocity.x + (Math.random() - 0.5) * 3, y: b.velocity.y - 4 });
  });

  document.getElementById('restart').onclick = start;
  document.getElementById('min').onchange = start;
  document.getElementById('pause').onclick = e => {
    paused = !paused;
    if (!paused) last = performance.now();   // the next grain comes a full interval after the break
    e.target.textContent = paused ? "I'm back" : 'Pause';
    document.getElementById('sub').textContent = paused ? 'paused' : 'hourglass physics test · Matter.js';
  };
  const speedButtons = document.querySelectorAll('[data-ms]');
  const markSpeed = () => speedButtons.forEach(b => b.classList.toggle('on', +b.dataset.ms === every));
  speedButtons.forEach(b => b.onclick = () => { every = +b.dataset.ms; last = performance.now(); markSpeed(); });
  markSpeed();
  window.addEventListener('resize', start);

  start();
  requestAnimationFrame(step);
</script>
</body>
</html>
