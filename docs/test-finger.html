<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finger demo preview</title>
<style>
  body { margin: 0; background: #2a2a2e; color: #ccc; font: 14px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  #phone { position: relative; width: 360px; height: 640px; border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 8px #111; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  /* the demo hand: the same thing the app would draw over the real screen */
  #finger { position: absolute; left: 0; top: 0; width: 56px; height: 56px; pointer-events: none; opacity: 0; mix-blend-mode: difference;
    transform: translate(200px, 700px); transition: transform .9s cubic-bezier(.4,0,.2,1), opacity .4s; }
  #finger svg { display: block; transform-origin: 20px 8px; transition: transform .14s; }
  #finger.down svg { transform: scale(.85); }
  .ripple { mix-blend-mode: difference; position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 2px solid #fff; opacity: .9;
    pointer-events: none; animation: rip .6s ease-out forwards; }
  @keyframes rip { to { transform: scale(3.4); opacity: 0; } }
  #cap { position: absolute; left: 28px; top: -30px; transform: translateX(-50%); white-space: nowrap; color: #fff; font-size: 15px; letter-spacing: .04em; opacity: 0; transition: opacity .4s; }
  button { font: inherit; padding: 6px 14px; }
</style>
</head>
<body>
<div id="phone">
  <iframe id="app" src="./?m=10&look=honey"></iframe>
  <div id="finger"><div id="cap"></div><svg viewBox="0 0 56 56" width="56" height="56"><path d="M20 6c-2.6 0-4 1.8-4 4v20l-3.2-3c-1.6-1.4-4-1.2-5.2.5-1 1.4-.8 3 .4 4.2L18 47c2 2.2 4.4 3 7 3h8c5.5 0 9-3.6 9-9V28c0-2-1.4-3.4-3.2-3.4-.8 0-1.6.3-2.2.9-.4-1.6-1.6-2.5-3.2-2.5-1 0-1.9.4-2.5 1.1-.5-1.5-1.6-2.3-3.1-2.3-.6 0-1.2.2-1.7.5V10c0-2.2-1.4-4-4-4z" fill="#fff"/></svg></div>
</div>
<div>Preview of the first-use hint (the finger shows how to tap; your own tap ends it). <button id="again">Replay</button></div>
<script>
  const app = document.getElementById('app'), fin = document.getElementById('finger'), cap = document.getElementById('cap'), phone = document.getElementById('phone');
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const move = (x, y) => { fin.style.transform = `translate(${x - 20}px, ${y - 8}px)`; return wait(950); };
  // the finger only shows how to tap, nothing is sent to the app
  async function tap(x, y) {
    fin.classList.add('down');
    const r = document.createElement('div'); r.className = 'ripple'; r.style.left = x + 'px'; r.style.top = y + 'px'; phone.appendChild(r);
    setTimeout(() => r.remove(), 700);
    await wait(200); fin.classList.remove('down'); await wait(300);
  }
  const say = t => { cap.textContent = t; cap.style.opacity = t ? 1 : 0; };
  let run = 0;
  // find real empty background in the running app: the spot whose surroundings are all background colour (items, decoration, text are not)
  function findVoid() {
    try {
      const d = app.contentDocument, cv = d.getElementById('canvas'), r = cv.getBoundingClientRect(), k = cv.width / r.width;
      const g = cv.getContext('2d'), bg = g.getImageData(2, 2, 1, 1).data;
      const same = (x, y, rad) => {
        const px = g.getImageData(Math.max(0, (x - rad) * k), Math.max(0, (y - rad) * k), rad * 2 * k, rad * 2 * k).data;
        for (let i = 0; i < px.length; i += 4) if (Math.abs(px[i] - bg[0]) + Math.abs(px[i + 1] - bg[1]) + Math.abs(px[i + 2] - bg[2]) > 3) return false;
        return true;
      };
      let best = null;
      for (let rad = 44; rad >= 14 && !best; rad -= 6)
        for (let y = r.top + 120; y < r.bottom - 100 && !best; y += 12)
          for (let x = r.left + 40; x < r.right - 40; x += 12)
            if (same(x - r.left, y - r.top, rad)) { best = [x, y]; break; }
      return best;
    } catch (e) { return null; }
  }
  async function demo() {
    const me = ++run, ok = () => me === run;
    while (ok()) {
      say(''); fin.style.opacity = 0; fin.style.transform = 'translate(200px, 700px)';
      await wait(1800); if (!ok()) return;
      fin.style.opacity = 1;
      const [vx, vy] = findVoid() || [190, 440];
      await move(vx, vy); if (!ok()) return;
      say('tap the void'); await tap(vx, vy); await wait(1400); if (!ok()) return;
      say(''); fin.style.opacity = 0; await wait(1500);
    }
  }
  // a real tap by the user ends the hint
  function watch() { try { app.contentDocument.addEventListener('pointerdown', () => { run++; say(''); fin.style.opacity = 0; }); } catch (e) {} }
  document.getElementById('again').onclick = () => { app.src = './?m=10&look=honey'; };
  app.onload = () => { watch(); demo(); };
</script>
</body>
</html>
