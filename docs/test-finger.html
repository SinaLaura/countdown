<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finger demo preview</title>
<style>
  body { margin: 0; background: #2a2a2e; color: #ccc; font: 14px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  #phone { position: relative; width: 360px; height: 640px; border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 8px #111; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  /* the demo hand: the same thing the app would draw over the real screen */
  #finger { position: absolute; left: 0; top: 0; width: 56px; height: 56px; pointer-events: none; opacity: 0;
    transform: translate(200px, 700px); transition: transform .9s cubic-bezier(.4,0,.2,1), opacity .4s; }
  #finger svg { display: block; transition: transform .14s; transform-origin: 20px 10px; }
  #finger.down svg { transform: scale(.82); }
  .ripple { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 2px solid #fff; opacity: .9;
    pointer-events: none; animation: rip .6s ease-out forwards; }
  @keyframes rip { to { transform: scale(3.4); opacity: 0; } }
  #cap { position: absolute; left: 0; right: 0; bottom: 130px; text-align: center; color: #fff; font-size: 15px; letter-spacing: .04em; opacity: 0; transition: opacity .4s; pointer-events: none; text-shadow: 0 1px 6px #000; }
  button { font: inherit; padding: 6px 14px; }
</style>
</head>
<body>
<div id="phone">
  <iframe id="app" src="./?m=10&look=honey"></iframe>
  <div id="finger"><svg viewBox="0 0 56 56" width="56" height="56"><path d="M20 6c-2.6 0-4 1.8-4 4v20l-3.2-3c-1.6-1.4-4-1.2-5.2.5-1 1.4-.8 3 .4 4.2L18 47c2 2.2 4.4 3 7 3h8c5.5 0 9-3.6 9-9V28c0-2-1.4-3.4-3.2-3.4-.8 0-1.6.3-2.2.9-.4-1.6-1.6-2.5-3.2-2.5-1 0-1.9.4-2.5 1.1-.5-1.5-1.6-2.3-3.1-2.3-.6 0-1.2.2-1.7.5V10c0-2.2-1.4-4-4-4z" fill="#fff" stroke="#333" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
  <div id="cap"></div>
</div>
<div>Preview of the first-use hint (tap an item, then the background). <button id="again">Replay</button></div>
<script>
  const app = document.getElementById('app'), fin = document.getElementById('finger'), cap = document.getElementById('cap'), phone = document.getElementById('phone');
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const move = (x, y) => { fin.style.transform = `translate(${x - 20}px, ${y - 10}px)`; return wait(950); };
  // the finger really taps: the event goes to the real app inside the frame
  async function tap(x, y) {
    fin.classList.add('down');
    const r = document.createElement('div'); r.className = 'ripple'; r.style.left = x + 'px'; r.style.top = y + 'px'; phone.appendChild(r);
    setTimeout(() => r.remove(), 700);
    const d = app.contentDocument, el = d.elementFromPoint(x, y) || d.body;
    el.dispatchEvent(new (app.contentWindow.PointerEvent)('pointerdown', { clientX: x, clientY: y, bubbles: true }));
    await wait(200); fin.classList.remove('down'); await wait(300);
  }
  const say = t => { cap.textContent = t; cap.style.opacity = t ? 1 : 0; };
  let run = 0;
  async function demo() {
    const me = ++run;
    const ok = () => me === run;
    say(''); fin.style.opacity = 0; fin.style.transform = 'translate(200px, 700px)';
    await wait(1200); if (!ok()) return;
    fin.style.opacity = 1;
    await move(105, 165); if (!ok()) return;       // on a bit
    say('tap a bit'); await tap(105, 165); await wait(900); if (!ok()) return;
    await move(190, 440); if (!ok()) return;       // on the empty background
    say('tap the empty space: new look'); await tap(190, 440); await wait(1600); if (!ok()) return;
    say(''); fin.style.opacity = 0;
  }
  document.getElementById('again').onclick = () => { app.src = './?m=10&look=honey'; app.onload = () => demo(); };
  app.onload = () => demo();
</script>
</body>
</html>
